name: Deploy web to Cloudflare Pages

# Builds the Flutter web app and publishes it to Cloudflare Pages on every push
# to main. You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds Dart code and assets, so generate the web folder.
      - name: Create web platform files
        run: flutter create . --platforms web --project-name crossgym --org com.crossgym

      # flutter create adds a sample test that refers to a "MyApp" class this
      # project does not have, so remove it.
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Check exercise drawings
        run: ./tool/check_assets.sh

      # Real errors fail the build. Style hints and deprecation notices do not.
      - run: flutter analyze --no-fatal-infos

      - name: Build web
        run: flutter build web --release

      # Pasted secrets often carry a trailing space or line break, which makes
      # Cloudflare reject them. Tokens never contain whitespace, so strip it.
      - name: Clean Cloudflare secrets
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          account="$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      # Creates the Pages project the first time. Fails harmlessly if it exists.
      - name: Create Pages project
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          command: pages project create crossgym --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          command: pages deploy build/web --project-name=crossgym --branch=main
